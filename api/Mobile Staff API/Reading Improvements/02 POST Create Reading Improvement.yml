info:
  name: 02 POST Create Reading Improvement
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/mobile/staff/reading-improvements"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{staffToken}}"
  body:
    type: json
    data: |-
      {
        "student": "{{studentId}}",
        "course": "{{courseId}}",
        "type": "slight_improvement",
        "occurred_at": "2026-08-01",
        "description": "تقييم قراءة تجريبي"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("passes mobile staff authentication and authorization", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `POST api/mobile/staff/reading-improvements` باستخدام Bearer Access Token خاص بقناة كادر الموبايل.
  
  الصلاحية المطلوبة: `إنشاء تقييم قراءة`.
  
  تنبيه: قد يغيّر هذا الطلب البيانات المحلية.
