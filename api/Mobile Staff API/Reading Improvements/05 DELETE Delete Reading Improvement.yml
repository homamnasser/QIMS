info:
  name: 05 DELETE Delete Reading Improvement
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/api/mobile/staff/reading-improvements/{{readingImprovementId}}"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{staffToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("passes mobile staff authentication and authorization", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `DELETE api/mobile/staff/reading-improvements/{{readingImprovementId}}` باستخدام Bearer Access Token خاص بقناة كادر الموبايل.
  
  الصلاحية المطلوبة: `حذف تقييم القراءة`.
  
  تنبيه: قد يغيّر هذا الطلب البيانات المحلية.
