info:
  name: POST Create Exam
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/mobile/staff/exams"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{staffToken}}"
  body:
    type: json
    data: |-
      {
        "student": "{{studentId}}",
        "subject": "{{subjectId}}",
        "course": "{{courseId}}",
        "mark": 90
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("passes mobile staff authentication and authorization", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `POST api/mobile/staff/exams` باستخدام Bearer Access Token خاص بقناة كادر الموبايل.
  
  الصلاحية المطلوبة: `إنشاء امتحان`.
  
  تنبيه: قد يغيّر هذا الطلب البيانات المحلية.
