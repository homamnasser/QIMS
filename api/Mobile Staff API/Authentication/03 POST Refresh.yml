info:
  name: POST Refresh
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/mobile/auth/refresh"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{staffRefreshToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body?.data?.access_token) {
          bru.setEnvVar("staffToken", String(res.body.data.access_token));
          bru.setEnvVar("staffRefreshToken", String(res.body.data.refresh_token));
        }
    - type: tests
      code: |-
        test("rotates the mobile staff token pair", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.access_token).to.be.a("string");
          expect(res.body.data.refresh_token).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `POST api/mobile/auth/refresh` باستخدام Bearer Access Token خاص بقناة كادر الموبايل.
  
  تنبيه: قد يغيّر هذا الطلب البيانات المحلية.
