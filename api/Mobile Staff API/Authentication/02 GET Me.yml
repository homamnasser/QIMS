info:
  name: GET Me
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/mobile/auth/me"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{staffToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns the authenticated mobile staff account", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.user.account_type).to.equal("staff");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `GET api/mobile/auth/me` باستخدام Bearer Access Token خاص بقناة كادر الموبايل.
