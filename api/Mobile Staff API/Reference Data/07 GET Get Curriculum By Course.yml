info:
  name: GET Get Curriculum By Course
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/mobile/staff/courses/:courseId/curriculum"
  params:
    - name: courseId
      value: "{{courseId}}"
      type: path
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{staffToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("passes mobile staff authentication and authorization", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `GET api/mobile/staff/courses/{courseId}/curriculum` باستخدام Bearer Access Token خاص بقناة كادر الموبايل.
  
  الصلاحية المطلوبة: `عرض المنهج الدراسي للكورس`.
