info:
  name: POST Create Memorization
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/mobile/staff/memorizations"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{staffToken}}"
  body:
    type: json
    data: |-
      {
        "student_id": "{{studentId}}",
        "circle_id": "{{circleId}}",
        "course_id": "{{courseId}}",
        "record_type": "memorization",
        "recorded_at": "2026-08-01",
        "name": "تسميع تجريبي",
        "start_page": 1,
        "end_page": 2
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("passes mobile staff authentication and authorization", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `POST api/mobile/staff/memorizations` باستخدام Bearer Access Token خاص بقناة كادر الموبايل.
  
  الصلاحية المطلوبة: `إنشاء تسميع`.
  
  تنبيه: قد يغيّر هذا الطلب البيانات المحلية.
