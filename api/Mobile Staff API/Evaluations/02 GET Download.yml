info:
  name: GET Download
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/mobile/staff/certificates/:certificate/download"
  params:
    - name: certificate
      value: "{{certificateId}}"
      type: path
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{staffToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("passes mobile staff authentication and authorization", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `GET api/mobile/staff/certificates/{certificate}/download` باستخدام Bearer Access Token خاص بقناة كادر الموبايل.
  
  الصلاحية المطلوبة: `عرض تقييمات الطلاب النهائية`.
