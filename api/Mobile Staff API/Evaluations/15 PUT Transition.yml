info:
  name: PUT Transition
  type: http
  seq: 15

http:
  method: PUT
  url: "{{baseUrl}}/api/mobile/staff/evaluation-cycles/:cycle/status"
  params:
    - name: cycle
      value: "{{evaluationCycleId}}"
      type: path
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{staffToken}}"
  body:
    type: json
    data: |-
      {
        "status": "data_collection"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("passes mobile staff authentication and authorization", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `PUT api/mobile/staff/evaluation-cycles/{cycle}/status` باستخدام Bearer Access Token خاص بقناة كادر الموبايل.
  
  الصلاحية المطلوبة: `إدارة دورات التقييم`.
  
  تنبيه: قد يغيّر هذا الطلب البيانات المحلية.
