info:
  name: POST Approve Administration
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/mobile/staff/administration-observations/:observation/approve"
  params:
    - name: observation
      value: "{{administrationObservationId}}"
      type: path
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{staffToken}}"
  body:
    type: json
    data: |-
      {}

runtime:
  scripts:
    - type: tests
      code: |-
        test("passes mobile staff authentication and authorization", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `POST api/mobile/staff/administration-observations/{observation}/approve` باستخدام Bearer Access Token خاص بقناة كادر الموبايل.
  
  الصلاحية المطلوبة: `إدارة تقييم الإدارة`.
  
  تنبيه: قد يغيّر هذا الطلب البيانات المحلية.
