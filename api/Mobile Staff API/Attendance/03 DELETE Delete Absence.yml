info:
  name: DELETE Delete Absence
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}/api/mobile/staff/attendance/:id"
  params:
    - name: id
      value: "{{attendanceId}}"
      type: path
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{staffToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("passes mobile staff authentication and authorization", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `DELETE api/mobile/staff/attendance/{id}` باستخدام Bearer Access Token خاص بقناة كادر الموبايل.
  
  الصلاحية المطلوبة: `حذف غياب`.
  
  تنبيه: قد يغيّر هذا الطلب البيانات المحلية.
