info:
  name: POST Update Assign Lessons To Date
  type: http
  seq: 5
  tags:
    - web-session
    - write

http:
  method: POST
  url: "{{baseUrl}}/api/dateLesson/updateAssignLessonsToDate/:courseDate"
  params:
    - name: courseDate
      value: "{{courseDateId}}"
      type: path
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrfToken}}"
  body:
    type: multipart-form
    data:
      - name: lesson_ids[]
        type: text
        value: "100"
      - name: lesson_ids[]
        type: text
        value: "11"
        disabled: true


runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `POST /api/dateLesson/updateAssignLessonsToDate/{courseDate}` ضمن مجموعة Curriculum.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `تعديل إسناد دروس التاريخ`.

  تنبيه: هذا الطلب قد يغيّر البيانات. راجع القيم قبل الإرسال.
