info:
  name: POST Assign Lessons To Date
  type: http
  seq: 1
  tags:
    - web-session
    - write

http:
  method: POST
  url: "{{baseUrl}}/api/dateLesson/assignLessonsToDate"
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrfToken}}"
  body:
    type: multipart-form
    data:
      - name: course_date_id
        type: text
        value: "1"
      - name: lesson_ids[]
        type: text
        value: "4"
      - name: lesson_ids[]
        type: text
        value: "5"


runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `POST /api/dateLesson/assignLessonsToDate` ضمن مجموعة Curriculum.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `إسناد الدروس للتاريخ`.

  تنبيه: هذا الطلب قد يغيّر البيانات. راجع القيم قبل الإرسال.
