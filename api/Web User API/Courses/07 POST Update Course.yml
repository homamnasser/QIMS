info:
  name: POST Update Course
  type: http
  seq: 7
  tags:
    - web-session
    - write

http:
  method: POST
  url: "{{baseUrl}}/api/course/updateCourse/:id"
  params:
    - name: id
      value: "{{courseId}}"
      type: path
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrfToken}}"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: qqqww
      - name: description
        type: text
        value: vvv
      - name: mosque_id
        type: text
        value: "6"
        disabled: true
      - name: project_id
        type: text
        value: "6"
        disabled: true
      - name: start_date
        type: text
        value: 2026-02-18
      - name: end_date
        type: text
        value: 2027-02-18
      - name: parent_course_id
        type: text
        value: ""
      - name: supervisor_id
        type: text
        value: "5"


runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `POST /api/course/updateCourse/{id}` ضمن مجموعة Courses.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `تعديل الكورس`.

  تنبيه: هذا الطلب قد يغيّر البيانات. راجع القيم قبل الإرسال.
