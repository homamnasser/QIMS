info:
  name: POST Update Result
  type: http
  seq: 6
  tags:
    - web-session
    - write

http:
  method: POST
  url: "{{baseUrl}}/api/sabr/updateSabrResult/:id"
  params:
    - name: id
      value: "{{sabrId}}"
      type: path
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrfToken}}"
  body:
    type: multipart-form
    data:
      - name: value
        type: text
        value: "100"
      - name: note
        type: text
        value: exe


runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `POST /api/sabr/updateSabrResult/{id}` ضمن مجموعة Sabrs.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `تعديل نتيجة السبر`.

  تنبيه: هذا الطلب قد يغيّر البيانات. راجع القيم قبل الإرسال.
