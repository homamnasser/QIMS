info:
  name: GET Get All Projects
  type: http
  seq: 4
  tags:
    - web-session
    - read

http:
  method: GET
  url: "{{baseUrl}}/api/project/getAllProjects"
  params:
    - name: active
      value: "false"
      type: query
      disabled: true
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `GET /api/project/getAllProjects` ضمن مجموعة Projects.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `عرض كافة المشاريع`.
