info:
  name: POST Create Project
  type: http
  seq: 1
  tags:
    - web-session
    - write

http:
  method: POST
  url: "{{baseUrl}}/api/project/createProject"
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrfToken}}"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: testttt
      - name: description
        type: text
        value: fds
      - name: audience
        type: text
        value: wf
      - name: supervisor
        type: text
        value: "4"
      - name: logo
        type: file
        value: []
        disabled: true



runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `POST /api/project/createProject` ضمن مجموعة Projects.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `إنشاء مشروع`.

  تنبيه: هذا الطلب قد يغيّر البيانات. راجع القيم قبل الإرسال.
