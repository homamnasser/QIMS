info:
  name: POST Revoke
  type: http
  seq: 3
  tags:
    - web-session
    - write

http:
  method: POST
  url: "{{baseUrl}}/api/certificates/:certificate/revoke"
  params:
    - name: certificate
      value: "{{certificateId}}"
      type: path
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrfToken}}"
  body:
    type: json
    data: |-
      {
        "reason": "إلغاء تجريبي للشهادة من Bruno"
      }


runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `POST /api/certificates/{certificate}/revoke` ضمن مجموعة Evaluations.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `إصدار الشهادات النهائية`.

  تنبيه: هذا الطلب قد يغيّر البيانات. راجع القيم قبل الإرسال.
