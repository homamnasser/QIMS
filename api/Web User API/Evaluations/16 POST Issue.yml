info:
  name: POST Issue
  type: http
  seq: 16
  tags:
    - web-session
    - write

http:
  method: POST
  url: "{{baseUrl}}/api/evaluation-results/:result/certificate"
  params:
    - name: result
      value: "{{evaluationResultId}}"
      type: path
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrfToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `POST /api/evaluation-results/{result}/certificate` ضمن مجموعة Evaluations.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `إصدار الشهادات النهائية`.

  تنبيه: هذا الطلب قد يغيّر البيانات. راجع القيم قبل الإرسال.
