info:
  name: GET Review
  type: http
  seq: 5
  tags:
    - web-session
    - read

http:
  method: GET
  url: "{{baseUrl}}/api/evaluation-candidates/:candidate/review"
  params:
    - name: candidate
      value: "{{evaluationCandidateId}}"
      type: path
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `GET /api/evaluation-candidates/{candidate}/review` ضمن مجموعة Evaluations.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `إدخال تقييم المدرس|عرض تقييمات الطلاب النهائية`.
