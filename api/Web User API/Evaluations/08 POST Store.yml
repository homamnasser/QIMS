info:
  name: POST Store
  type: http
  seq: 8
  tags:
    - web-session
    - write

http:
  method: POST
  url: "{{baseUrl}}/api/evaluation-cycles"
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrfToken}}"
  body:
    type: json
    data: |-
      {
        "project_id": "{{projectId}}",
        "name": "دورة تقييم تجريبية",
        "season": "summer",
        "top_students_count": 10,
        "course_ids": [
          "{{courseId}}"
        ],
        "periods": [
          {
            "name": "الفترة الأولى",
            "sequence": 1,
            "start_date": "2026-07-01",
            "end_date": "2026-07-31"
          }
        ]
      }


runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `POST /api/evaluation-cycles` ضمن مجموعة Evaluations.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `إدارة دورات التقييم`.

  تنبيه: هذا الطلب قد يغيّر البيانات. راجع القيم قبل الإرسال.
