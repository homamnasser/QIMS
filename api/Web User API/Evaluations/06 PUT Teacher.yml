info:
  name: PUT Teacher
  type: http
  seq: 6
  tags:
    - web-session
    - write

http:
  method: PUT
  url: "{{baseUrl}}/api/evaluation-candidates/:candidate/teacher-evaluation"
  params:
    - name: candidate
      value: "{{evaluationCandidateId}}"
      type: path
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrfToken}}"
  body:
    type: json
    data: |-
      {
        "evaluation_period_id": "{{evaluationPeriodId}}",
        "circle_id": "{{circleId}}",
        "behavior_score": 10,
        "participation_score": 10,
        "teacher_opinion_score": 10,
        "comments": "تقييم تجريبي من Bruno",
        "status": "submitted"
      }


runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `PUT /api/evaluation-candidates/{candidate}/teacher-evaluation` ضمن مجموعة Evaluations.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `إدخال تقييم المدرس`.

  تنبيه: هذا الطلب قد يغيّر البيانات. راجع القيم قبل الإرسال.
