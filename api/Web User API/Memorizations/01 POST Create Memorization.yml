info:
  name: POST Create Memorization
  type: http
  seq: 1
  tags:
    - web-session
    - write

http:
  method: POST
  url: "{{baseUrl}}/api/memorization/createMemorization"
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrfToken}}"
  body:
    type: json
    data: |-
      {
        "student_id": "{{studentId}}",
        "circle_id": "{{circleId}}",
        "course_id": "{{courseId}}",
        "record_type": "memorization",
        "recorded_at": "2026-08-01",
        "name": "تسميع تجريبي",
        "start_page": 1,
        "end_page": 2
      }


runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `POST /api/memorization/createMemorization` ضمن مجموعة Memorizations.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `إنشاء تسميع`.

  تنبيه: هذا الطلب قد يغيّر البيانات. راجع القيم قبل الإرسال.
