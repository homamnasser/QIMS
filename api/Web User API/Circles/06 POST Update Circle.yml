info:
  name: POST Update Circle
  type: http
  seq: 6
  tags:
    - web-session
    - write

http:
  method: POST
  url: "{{baseUrl}}/api/circle/updateCircle/:id"
  params:
    - name: id
      value: "{{circleId}}"
      type: path
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrfToken}}"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: "qqq "
      - name: teacher_id
        type: text
        value: "3"
      - name: course_id
        type: text
        value: "2"


runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `POST /api/circle/updateCircle/{id}` ضمن مجموعة Circles.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `تعديل الحلقة`.

  تنبيه: هذا الطلب قد يغيّر البيانات. راجع القيم قبل الإرسال.
