info:
  name: POST Create Exam
  type: http
  seq: 1
  tags:
    - web-session
    - write

http:
  method: POST
  url: "{{baseUrl}}/api/exam/createExam"
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrfToken}}"
  body:
    type: multipart-form
    data:
      - name: student
        type: text
        value: "2"
      - name: subject
        type: text
        value: "5"
      - name: course
        type: text
        value: "5"
      - name: mark
        type: text
        value: "100"


runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `POST /api/exam/createExam` ضمن مجموعة Exams.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `إنشاء امتحان`.

  تنبيه: هذا الطلب قد يغيّر البيانات. راجع القيم قبل الإرسال.
