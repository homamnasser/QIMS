info:
  name: GET Get Notes By Student Id
  type: http
  seq: 4
  tags:
    - web-session
    - read

http:
  method: GET
  url: "{{baseUrl}}/api/note/getNotesByStudentId/:studentId"
  params:
    - name: studentId
      value: "{{studentId}}"
      type: path
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `GET /api/note/getNotesByStudentId/{studentId}` ضمن مجموعة Notes.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `عرض ملاحظات الطالب`.
