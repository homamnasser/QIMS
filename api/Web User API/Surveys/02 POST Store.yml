info:
  name: POST Store
  type: http
  seq: 2
  tags:
    - web-session
    - write

http:
  method: POST
  url: "{{baseUrl}}/api/surveys"
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrfToken}}"
  body:
    type: json
    data: |-
      {
        "name": "استبيان تجريبي من Bruno",
        "description": "استبيان محلي لاختبار واجهات النظام.",
        "starts_at": null,
        "ends_at": null,
        "allow_multiple_responses": false
      }


runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `POST /api/surveys` ضمن مجموعة Surveys.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `إنشاء استبيان`.

  تنبيه: هذا الطلب قد يغيّر البيانات. راجع القيم قبل الإرسال.
