info:
  name: GET Download File
  type: http
  seq: 10
  tags:
    - web-session
    - read

http:
  method: GET
  url: "{{baseUrl}}/api/surveys/files/:accessToken"
  params:
    - name: accessToken
      value: "{{surveyFileAccessToken}}"
      type: path
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `GET /api/surveys/files/{accessToken}` ضمن مجموعة Surveys.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `عرض وتصدير ردود الاستبيان`.
