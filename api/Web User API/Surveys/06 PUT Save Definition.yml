info:
  name: PUT Save Definition
  type: http
  seq: 6
  tags:
    - web-session
    - write

http:
  method: PUT
  url: "{{baseUrl}}/api/surveys/:survey/definition"
  params:
    - name: survey
      value: "{{surveyId}}"
      type: path
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrfToken}}"
  body:
    type: json
    data: |-
      {
        "sections": [
          {
            "client_id": "section-main",
            "title": "القسم الرئيسي",
            "description": null,
            "questions": [
              {
                "client_id": "question-main",
                "type": "radio",
                "title": "هل ترغب بالمتابعة؟",
                "description": null,
                "is_required": true,
                "validation_rules": [],
                "settings": {},
                "options": [
                  {
                    "label": "نعم",
                    "value": "yes"
                  },
                  {
                    "label": "لا",
                    "value": "no"
                  }
                ]
              }
            ]
          }
        ],
        "student_fields": [],
        "logic_rules": []
      }


runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `PUT /api/surveys/{survey}/definition` ضمن مجموعة Surveys.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `تعديل استبيان`.

  تنبيه: هذا الطلب قد يغيّر البيانات. راجع القيم قبل الإرسال.
