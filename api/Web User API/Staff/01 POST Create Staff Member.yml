info:
  name: POST Create Staff Member
  type: http
  seq: 1
  tags:
    - web-session
    - write

http:
  method: POST
  url: "{{baseUrl}}/api/createStaffMember"
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrfToken}}"
  body:
    type: multipart-form
    data:
      - name: first_name
        type: text
        value: saؤؤؤؤ
      - name: last_name
        type: text
        value: sa
      - name: phone
        type: text
        value: "0935452178"
      - name: email
        type: text
        value: 0935452177as@gmail.com
      - name: password
        type: text
        value: "123456789"
      - name: password_confirmation
        type: text
        value: "123456789"
      - name: birth_date
        type: text
        value: 2002-02-18
      - name: role_id
        type: text
        value: "3"


runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `POST /api/createStaffMember` ضمن مجموعة Staff.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `إنشاء موظف`.

  تنبيه: هذا الطلب قد يغيّر البيانات. راجع القيم قبل الإرسال.
