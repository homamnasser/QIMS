info:
  name: POST Update Lesson
  type: http
  seq: 5
  tags:
    - web-session
    - write

http:
  method: POST
  url: "{{baseUrl}}/api/lesson/updateLesson/:id"
  params:
    - name: id
      value: "{{courseDateId}}"
      type: path
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrfToken}}"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: LOg2
      - name: description
        type: text
        value: LOg2
      - name: start_page
        type: text
        value: "20"
      - name: end_page
        type: text
        value: "40"
      - name: subject_id
        type: text
        value: "1"


runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `POST /api/lesson/updateLesson/{id}` ضمن مجموعة Lessons.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `تعديل الدرس`.

  تنبيه: هذا الطلب قد يغيّر البيانات. راجع القيم قبل الإرسال.
