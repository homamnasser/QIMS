info:
  name: GET Get All Lessons
  type: http
  seq: 3
  tags:
    - web-session
    - read

http:
  method: GET
  url: "{{baseUrl}}/api/lesson/getAllLessons"
  params:
    - name: name
      value: LOg
      type: query
      disabled: true
    - name: subject_name
      value: taj
      type: query
      disabled: true
    - name: subject_id
      value: "6"
      type: query
      disabled: true
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `GET /api/lesson/getAllLessons` ضمن مجموعة Lessons.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `عرض كافة الدروس`.
