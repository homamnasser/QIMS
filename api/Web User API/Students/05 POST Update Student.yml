info:
  name: POST Update Student
  type: http
  seq: 5
  tags:
    - web-session
    - write

http:
  method: POST
  url: "{{baseUrl}}/api/student/updateStudent/:id"
  params:
    - name: id
      value: "{{studentId}}"
      type: path
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrfToken}}"
  body:
    type: multipart-form
    data:
      - name: first_name
        type: text
        value: Homam
      - name: last_name
        type: text
        value: naser
      - name: username
        type: text
        value: homam.naser-2026
      - name: phone_number
        type: text
        value: "0938316302"
      - name: birth_date
        type: text
        value: 2011-05-05
      - name: academic_class
        type: text
        value: الصف العاشر
      - name: reading_level
        type: text
        value: level_1
      - name: father_name
        type: text
        value: Muhamad
      - name: parent_social_state
        type: text
        value: married
      - name: father_phone
        type: text
        value: "0935452177"
      - name: password
        type: text
        value: "123456789"
      - name: password_confirmation
        type: text
        value: "123456789"


runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `POST /api/student/updateStudent/{id}` ضمن مجموعة Students.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `تعديل الطالب`.

  تنبيه: هذا الطلب قد يغيّر البيانات. راجع القيم قبل الإرسال.
