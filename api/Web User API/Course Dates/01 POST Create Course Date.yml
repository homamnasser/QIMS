info:
  name: POST Create Course Date
  type: http
  seq: 1
  tags:
    - web-session
    - write

http:
  method: POST
  url: "{{baseUrl}}/api/courseDate/createCourseDate"
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrfToken}}"
  body:
    type: multipart-form
    data:
      - name: course_id
        type: text
        value: "5"
      - name: days[]
        type: text
        value: Sunday
      - name: days[]
        type: text
        value: Tuesday
      - name: days[]
        type: text
        value: Thursday
      - name: excluded_dates[]
        type: text
        value: 2026-05-05
      - name: excluded_dates[]
        type: text
        value: 2026-05-03
      - name: excluded_dates[]
        type: text
        value: ""
        disabled: true


runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `POST /api/courseDate/createCourseDate` ضمن مجموعة Course Dates.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `إنشاء تاريخ الكورس`.

  تنبيه: هذا الطلب قد يغيّر البيانات. راجع القيم قبل الإرسال.
