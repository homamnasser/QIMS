info:
  name: POST Create Date Manual
  type: http
  seq: 2
  tags:
    - web-session
    - write

http:
  method: POST
  url: "{{baseUrl}}/api/courseDate/createDateManual"
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrfToken}}"
  body:
    type: multipart-form
    data:
      - name: course_id
        type: text
        value: "1"
      - name: session_date
        type: text
        value: 2026-05-05


runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `POST /api/courseDate/createDateManual` ضمن مجموعة Course Dates.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `إضافة تاريخ يدوياً`.

  تنبيه: هذا الطلب قد يغيّر البيانات. راجع القيم قبل الإرسال.
