info:
  name: POST Remove Student
  type: http
  seq: 3
  tags:
    - web-session
    - write

http:
  method: POST
  url: "{{baseUrl}}/api/studentCircle/removeStudentFromCircle"
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrfToken}}"
  body:
    type: multipart-form
    data:
      - name: circle_id
        type: text
        value: "1"
      - name: student_id
        type: text
        value: "2"


runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `POST /api/studentCircle/removeStudentFromCircle` ضمن مجموعة Enrollments.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  الصلاحية المطلوبة: `إلغاء التحاق طالب بالحلقة`.

  تنبيه: هذا الطلب قد يغيّر البيانات. راجع القيم قبل الإرسال.
