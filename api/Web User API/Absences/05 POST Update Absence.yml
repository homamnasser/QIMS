info:
  name: POST Update Absence
  type: http
  seq: 5
  tags:
    - web-session
    - write

http:
  method: POST
  url: "{{baseUrl}}/api/absence/updateAbsence/:id"
  params:
    - name: id
      value: "{{absenceId}}"
      type: path
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"
    - name: X-XSRF-TOKEN
      value: "{{xsrfToken}}"
  body:
    type: multipart-form
    data:
      - name: note
        type: text
        value: gg
      - name: type
        type: text
        value: present
      - name: date
        type: text
        value: 2026-02-22


runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `POST /api/absence/updateAbsence/{id}` ضمن مجموعة Absences.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.

  تنبيه: هذا الطلب قد يغيّر البيانات. راجع القيم قبل الإرسال.
