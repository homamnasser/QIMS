info:
  name: GET Get Absence By Id
  type: http
  seq: 3
  tags:
    - web-session
    - read

http:
  method: GET
  url: "{{baseUrl}}/api/absence/getAbsenceById/:id"
  params:
    - name: id
      value: "{{absenceId}}"
      type: path
  headers:
    - name: Accept
      value: "application/json"
    - name: Origin
      value: "{{webOrigin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("passes web authentication, channel and CSRF checks", function() {
          expect(res.status).to.not.equal(401);
          expect(res.status).to.not.equal(403);
          expect(res.status).to.not.equal(419);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  يختبر `GET /api/absence/getAbsenceById/{id}` ضمن مجموعة Absences.

  المسار يستخدم جلسة الويب HttpOnly الخاصة بـSanctum، ولا يقبل Bearer Token للموبايل.
