info:
  name: 04 Get My Circles
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/mobile/student/me/circles"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{studentToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns the authenticated student's circles", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns only circles linked to the authenticated student through
  `student_circles` and belonging to that student's current mosque. It does not
  list other circles in the same mosque.
