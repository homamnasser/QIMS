info:
  name: 06 Get My Notes
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/mobile/student/me/notes"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{studentToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns only the authenticated student's notes", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns notes addressed to the authenticated student. The endpoint accepts no
  student ID; unrelated query parameters are ignored and cannot change its
  ownership scope.
