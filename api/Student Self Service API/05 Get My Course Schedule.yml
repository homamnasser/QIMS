info:
  name: 05 Get My Course Schedule
  type: http
  seq: 5

http:
  method: GET
  url: http://127.0.0.1:8000/api/student/me/courses/:courseId/schedule
  headers:
    - name: Accept
      value: application/json
  params:
    - name: courseId
      value: "1"
      type: path
      description: ID of a course returned by Get My Courses
  auth:
    type: bearer
    token: "{{studentToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns the enrolled course schedule and assigned lessons", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.course.id).to.equal(Number(bru.getEnvVar("courseId")));
          expect(res.body.data.schedule).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns all scheduled days for one enrolled course, including the lessons
  assigned to each day. `courseId` must come from Get My Courses.

  A course that is missing or not enrolled for the authenticated student returns
  the same 404 response, preventing this endpoint from being used as a global
  course lookup.
