info:
  name: 05 Get My Courses
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/mobile/student/me/courses"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{studentToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && Array.isArray(res.body?.data) && res.body.data.length > 0) {
          bru.setEnvVar("courseId", String(res.body.data[0].id));
        }
    - type: tests
      code: |-
        test("returns the authenticated student's enrolled courses", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns distinct courses reached through the authenticated student's circle
  enrollments. The first returned course ID is stored as `courseId` for the
  schedule request. If the list is empty, set `courseId` manually after
  enrolling the test student.
