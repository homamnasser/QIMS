info:
  name: 01 Login as Student
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/mobile/auth/login"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "login": "{{studentUsername}}",
        "password": "{{studentPassword}}",
        "device_name": "{{deviceName}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body?.data?.access_token) {
          bru.setEnvVar("studentToken", String(res.body.data.access_token));
          bru.setEnvVar("refreshToken", String(res.body.data.refresh_token));
        }
    - type: tests
      code: |-
        test("student login succeeds", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.access_token).to.be.a("string");
          expect(res.body.data.refresh_token).to.be.a("string");
          expect(res.body.data.token_type).to.equal("Bearer");
          expect(res.body.data.user.account_type).to.equal("student");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Authenticates a student device and stores the short-lived access token and
  rotating refresh token in the selected Local environment.

  The example credentials match `TestDataSeeder`:
  - username: hammam-nasser
  - password: student123

  A production mobile application must store both values in the operating
  system's secure credential storage, never in ordinary preferences or logs.
