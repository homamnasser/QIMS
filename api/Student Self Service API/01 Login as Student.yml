info:
  name: 01 Login as Student
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/loginUser"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{studentUsername}}",
        "password": "{{studentPassword}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body?.data?.token) {
          bru.setEnvVar("studentToken", String(res.body.data.token));
        }
    - type: tests
      code: |-
        test("student login succeeds", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.token).to.be.a("string");
          expect(res.body.data.user.account_type).to.equal("student");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Authenticates a student and stores the Sanctum bearer token in the selected
  Local environment as `studentToken`.

  The example credentials match `TestDataSeeder`:
  - username: hammam-nasser
  - password: student123

  Run this request before the authenticated requests below.
