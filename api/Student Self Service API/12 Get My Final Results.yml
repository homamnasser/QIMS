info:
  name: 12 Get My Final Results
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/api/mobile/student/me/final-results"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{studentToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && Array.isArray(res.body?.data) && res.body.data.length > 0) {
          bru.setEnvVar("finalResultId", String(res.body.data[0].id));
          const certificate = res.body.data[0]?.certificates?.[0];
          if (certificate?.id) {
            bru.setEnvVar("certificateId", String(certificate.id));
          }
        }
    - type: tests
      code: |-
        test("returns only this student's published final results", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns published final results belonging to the authenticated student only.
  It stores the first result and issued certificate IDs for the following
  requests when such records exist.
