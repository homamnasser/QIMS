info:
  name: 12 Refresh Mobile Tokens
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/api/mobile/auth/refresh"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{refreshToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body?.data?.access_token) {
          bru.setEnvVar("studentToken", String(res.body.data.access_token));
          bru.setEnvVar("refreshToken", String(res.body.data.refresh_token));
        }
    - type: tests
      code: |-
        test("rotates the mobile access and refresh tokens", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.access_token).to.be.a("string");
          expect(res.body.data.refresh_token).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Uses the current refresh token once and replaces both tokens. The previous
  access and refresh tokens are revoked immediately and cannot be reused.
