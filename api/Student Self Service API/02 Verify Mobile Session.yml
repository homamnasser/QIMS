info:
  name: 02 Verify Mobile Session
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/mobile/auth/me"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{studentToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns the authenticated student account", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.user.account_type).to.equal("student");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Verifies the access token created by the student login request and returns
  only the authenticated mobile account. The endpoint rejects web-session
  cookies and tokens belonging to staff or other account types.
