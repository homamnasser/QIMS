info:
  name: 02 Get My Mosque
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/mobile/student/me/mosque"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{studentToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns only the authenticated student's mosque", function() {
          expect(res.status).to.equal(200);
          expect(res.body.code).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns the mosque recorded for the authenticated student. The request does
  not accept a student ID, so it cannot be redirected to another student's data.
  `data` is null when the student is not currently assigned to a mosque.
