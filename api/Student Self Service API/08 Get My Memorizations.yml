info:
  name: 08 Get My Memorizations
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/student/me/memorizations"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{studentToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns only the authenticated student's memorization records", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns the authenticated student's memorization records ordered by page
  number. No student or teacher identifier is accepted from the client.
