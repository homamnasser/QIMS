info:
  name: 11 Get My Exams
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/api/mobile/student/me/exams"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{studentToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns only the authenticated student's exams", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns exam results whose student foreign key matches the authenticated
  Student model. It never treats a staff User ID as a student ID.
